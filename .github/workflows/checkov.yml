name: Checkov Action

on:
  workflow_call:
    inputs:
      path:
        description: "Path to the Terraform code"
        required: true
        type: string

permissions:
  contents: read

jobs:
  checkov:
    name: Run Checkov for Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      - name: Run Checkov on Terraform files
        # Excepciones documentadas (entorno académico AWS Learner Lab):
        # - CKV_TF_1     pin por commit hash: el curso usa pin por tag SemVer (?ref=vX.Y.Z)
        # - CKV_AWS_130  IP pública en subred: la subred pública la requiere por diseño (EC2 con Apache)
        # - CKV2_AWS_11  flow logs: requiere CloudWatch/S3 adicional, fuera de alcance
        # - CKV2_AWS_12  default SG: no se gestiona el SG por defecto en este módulo
        run: >-
          checkov -d ${{ inputs.path }}
          --skip-check CKV_TF_1,CKV_AWS_130,CKV2_AWS_11,CKV2_AWS_12

